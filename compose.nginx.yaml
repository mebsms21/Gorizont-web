name: gorizont
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: gorizont
  WORDPRESS_DB_USER: gorizont
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Запустите bin/configure.sh}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG', true);
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: gorizont
      MARIADB_USER: gorizont
      MARIADB_PASSWORD: ${DB_PASSWORD:?Запустите bin/configure.sh}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Запустите bin/configure.sh}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.4-php8.3-fpm-alpine
    environment: *wordpress-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/gorizont:/var/www/html/wp-content/themes/gorizont:ro
      - ./wp-content/plugins/gorizont-core:/var/www/html/wp-content/plugins/gorizont-core:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/gorizont.ini:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/www/html/wp-config.php && php-fpm -t 2>/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./wp-content/themes/gorizont:/var/www/html/wp-content/themes/gorizont:ro
      - ./wp-content/plugins/gorizont-core:/var/www/html/wp-content/plugins/gorizont-core:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  cli:
    entrypoint: ["wp"]
    image: wordpress:cli-php8.3
    user: "82:82"
    environment: *wordpress-env
    profiles: ["tools"]
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/gorizont:/var/www/html/wp-content/themes/gorizont:ro
      - ./wp-content/plugins/gorizont-core:/var/www/html/wp-content/plugins/gorizont-core:ro
      - ./tests:/tests:ro
volumes:
  db_data:
  wordpress_data:
